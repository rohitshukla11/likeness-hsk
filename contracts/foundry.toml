# HSK Chain (OP Stack L2, gas token HSK). Mainnet chain 177, testnet 133.
# Cancun opcodes (PUSH0, MCOPY, transient storage) checked against mainnet with eth_call on 2026-10-27.
# Verification: Blockscout at https://hsk.blockscout.com (mainnet) and testnet-explorer.hskchain.net.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
use_literal_content = true
fs_permissions = [{ access = "write", path = "../deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
hsk_mainnet = "${HSK_RPC_URL}"
hsk_testnet = "${HSK_TESTNET_RPC_URL}"

[lint]
lint_on_build = false
