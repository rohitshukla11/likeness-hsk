<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brand console</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main>
      <h1>Brand console</h1>
      <p class="lede">The brand's payment agent. It checks every cart against the brand's policy and the chain before the wallet signs.</p>
      <div class="grid">
        <div>
          <div class="panel">
            <h2>Brand agent</h2>
            <dl id="who"></dl>
            <p style="margin: 14px 0 0"><button id="license">Take a licence (3 renders)</button></p>
            <p class="note" id="opnote"></p>
          </div>
          <div class="panel">
            <h2>Licences</h2>
            <table>
              <thead><tr><th>#</th><th>status</th><th>renders</th><th></th></tr></thead>
              <tbody id="licences"></tbody>
            </table>
            <div id="result"></div>
          </div>
        </div>
        <div class="panel">
          <h2>Message log</h2>
          <p class="note">A2A messages, AP2 mandates, HSP Gateway calls and webhooks, and on-chain transactions, in order.</p>
          <div class="log" id="log"></div>
        </div>
      </div>
    </main>
    <script type="module">
      import { api, header, esc, txLink, addrLink, startLog, saveBlob } from "/static/app.js";
      header("/brand");
      startLog(document.querySelector("#log"));
      const s = await api("/api/state");
      const row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
      const showWho = async () => {
        const st = await api("/api/state");
        document.querySelector("#who").innerHTML =
          row("wallet", addrLink(st, st.brand)) +
          row("policy", `≤ 0.10 ${esc(st.token)} per render, advertising only, 1.00 ${esc(st.token)} a day`) +
          row("spent today", `${(Number(st.spentToday) / 1e6).toFixed(2)} ${esc(st.token)}`) +
          row("creator's price", `${esc(st.terms.price)} ${esc(st.token)} per render`);
      };
      await showWho();
      if (!s.operator) {
        document.querySelector("#license").disabled = true;
        document.querySelector("#opnote").textContent = "Operator actions are off on this server; the log and Verify still work.";
      }
      const result = document.querySelector("#result");
      const busy = async (btn, fn) => {
        btn.disabled = true;
        try {
          await fn();
        } catch (e) {
          result.innerHTML = `<div class="result err">${esc(e.message)}</div>`;
        } finally {
          btn.disabled = !s.operator;
          await Promise.all([showLicences(), showWho()]);
        }
      };
      async function showLicences() {
        const list = await api("/api/licences?who=brand");
        document.querySelector("#licences").innerHTML = list.length
          ? list
              .map(
                (l) =>
                  `<tr><td>${esc(l.id)}</td><td><span class="pill ${esc(l.status)}">${esc(l.status)}</span></td><td>${l.renderCount} / ${l.renderCap}</td><td><button class="ghost" data-pay="${esc(l.id)}" ${l.status === "Active" && s.operator ? "" : "disabled"}>Pay for next render</button></td></tr>`,
              )
              .join("")
          : `<tr><td colspan="4" class="note">No licences yet.</td></tr>`;
      }
      document.querySelector("#licences").addEventListener("click", (ev) => {
        const id = ev.target?.dataset?.pay;
        if (!id) return;
        busy(ev.target, async () => {
          result.innerHTML = `<div class="result note">Paying through the HSP Gateway…</div>`;
          const r = await api("/api/brand/pay", { licenceId: id, brief: "spring campaign hero shot" });
          result.innerHTML = `<div class="result">
            <div>Render ${r.renderIndex} of licence ${esc(r.licenceId)} paid and delivered.</div>
            <div>HSP payment ${txLink(s, r.hspTx)} · receipt ${txLink(s, r.anchorTx)} · nonce ${r.nonceBound ? "bound to this render" : "assigned by the Gateway"}</div>
            <div class="mono">sha256 ${esc(r.assetHash)}</div>
            <p><button class="ghost" id="dl">Download (signed by the brand wallet)</button></p></div>`;
          document.querySelector("#dl").onclick = async () => {
            const claim = await api("/api/brand/download", { assetHash: r.assetHash });
            const res = await fetch(`/api/renders/${r.assetHash}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(claim) });
            if (!res.ok) return alert((await res.json()).error);
            saveBlob(await res.blob(), `likeness-render-${r.licenceId}-${r.renderIndex}.svg`);
          };
        });
      });
      document.querySelector("#license").onclick = (ev) =>
        busy(ev.target, async () => {
          const r = await api("/api/brand/license", { renderCap: 3 });
          result.innerHTML = `<div class="result">Licence ${esc(r.licenceId)} issued on chain, within the creator's published terms.</div>`;
        });
      await showLicences();
    </script>
  </body>
</html>
