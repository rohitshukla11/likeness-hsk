<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main>
      <h1>Verify</h1>
      <p class="lede">Drop a file. Its sha256 is computed in your browser and looked up on HSK Chain: was it rendered under a paid licence, and is that licence still in force?</p>
      <div class="grid">
        <div class="panel">
          <label class="drop" id="drop">Drop a file here, or click to choose<input type="file" id="file" hidden /></label>
          <p class="note">Or paste a sha256: <input id="hash" class="mono" style="width: 100%" placeholder="0x…" /></p>
        </div>
        <div class="panel">
          <h2>Verdict</h2>
          <div id="out" class="note">No file yet.</div>
        </div>
      </div>
    </main>
    <script type="module">
      import { api, header, esc, txLink, addrLink, sha256Hex, saveBlob } from "/static/app.js";
      const s = await api("/api/state");
      header("/verify", s);
      const out = document.querySelector("#out");
      async function check(hash) {
        out.innerHTML = "Checking…";
        try {
          const v = await api(`/api/verify?hash=${hash}`);
          if (v.verdict === "Unknown") {
            out.innerHTML = `<div class="big">Unknown</div><p>${esc(v.reason)}</p>`;
            return;
          }
          const meaning = {
            Licensed: "Made under a licence that is still in force.",
            Expired: "Licensed when made; the licence has since ended.",
            Revoked: "Licensed when made; the creator has since revoked the licence.",
          }[v.verdict];
          out.innerHTML = `<div class="big"><span class="pill ${esc(v.verdict)}">${esc(v.verdict)}</span></div><p>${esc(meaning)}</p>
            <h2 style="margin-top:14px">Receipt</h2>
            <dl>
              <dt>licence</dt><dd>#${esc(v.licenceId)}, render ${v.renderIndex} (licence now ${esc(v.licenceStatus)}, ${v.licenceStatus === "Expired" ? "ended" : "ends"} ${new Date(v.licenceEnd * 1000).toLocaleDateString()})</dd>
              <dt>creator</dt><dd>${addrLink(s, v.creator)}</dd>
              <dt>licensee</dt><dd>${addrLink(s, v.licensee)}</dd>
              <dt>anchored</dt><dd>${new Date(v.anchoredAt * 1000).toLocaleString()} ${v.anchorTx ? txLink(s, v.anchorTx) : ""}</dd>
            </dl>
            <h2 style="margin-top:14px">Payment</h2>
            <dl>
              <dt>amount</dt><dd>${esc(v.paid)} ${esc(s.token)}, paid through the HSP Gateway ${txLink(s, v.hspTxHash)}</dd>
              <dt>recorded</dt><dd>${new Date(v.paidAt * 1000).toLocaleString()} ${v.recordTx ? txLink(s, v.recordTx) : ""}</dd>
              <dt>binding</dt><dd>${v.nonceBound ? "the brand's authorization nonce was bound to this licence and render" : "the Gateway chose the nonce; the creator's agent attested the binding"}</dd>
            </dl>
            <p><button class="ghost" id="dl">Download as the licensee (wallet signature)</button></p>
            <p class="note">Only the licensee's wallet can download a licensed render: the server checks the signature against the licence on chain.</p>`;
          document.querySelector("#dl").onclick = () => download(hash);
        } catch (e) {
          out.innerHTML = `<span class="err">${esc(e.message)}</span>`;
        }
      }
      async function download(hash) {
        if (!window.ethereum) return alert("Open this page in a browser with a wallet (the licensee's) to download.");
        const [account] = await window.ethereum.request({ method: "eth_requestAccounts" });
        const { issuedAt, message } = await api(`/api/renders/${hash}`);
        const hex = `0x${[...new TextEncoder().encode(message)].map((b) => b.toString(16).padStart(2, "0")).join("")}`;
        const signature = await window.ethereum.request({ method: "personal_sign", params: [hex, account] });
        const res = await fetch(`/api/renders/${hash}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ issuedAt, signature }) });
        if (!res.ok) return alert((await res.json()).error);
        saveBlob(await res.blob(), `likeness-render-${hash.slice(2, 10)}`);
      }
      const drop = document.querySelector("#drop");
      const file = document.querySelector("#file");
      file.onchange = async () => file.files[0] && check(await sha256Hex(file.files[0]));
      drop.addEventListener("dragover", (e) => (e.preventDefault(), drop.classList.add("over")));
      drop.addEventListener("dragleave", () => drop.classList.remove("over"));
      drop.addEventListener("drop", async (e) => {
        e.preventDefault();
        drop.classList.remove("over");
        if (e.dataTransfer.files[0]) check(await sha256Hex(e.dataTransfer.files[0]));
      });
      const q = new URLSearchParams(location.search).get("hash");
      if (q && /^0x[0-9a-fA-F]{64}$/.test(q)) check(q);
      document.querySelector("#hash").addEventListener("change", (e) => /^0x[0-9a-fA-F]{64}$/.test(e.target.value.trim()) && check(e.target.value.trim()));
    </script>
  </body>
</html>
