<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Ana Reyes, a synthetic demo face (flat vector illustration)">
  <!-- Ana Reyes: a synthetic demo creator, drawn as a flat vector illustration for Likeness. Not a photo of anyone. -->
  <!-- hair, back -->
  <g fill="#2B1D16">
    <circle cx="200" cy="170" r="118"/>
    <circle cx="104" cy="210" r="52"/>
    <circle cx="296" cy="210" r="52"/>
    <circle cx="92" cy="270" r="44"/>
    <circle cx="308" cy="270" r="44"/>
    <circle cx="110" cy="318" r="34"/>
    <circle cx="290" cy="318" r="34"/>
  </g>
  <!-- shoulders and top -->
  <path d="M60 500c6-86 62-126 140-126s134 40 140 126z" fill="#4C5230"/>
  <path d="M168 374h64l-8 40c-12 10-36 10-48 0z" fill="#B97E5B"/>
  <!-- neck -->
  <rect x="172" y="300" width="56" height="84" rx="24" fill="#C68E6A"/>
  <!-- face -->
  <ellipse cx="200" cy="232" rx="84" ry="102" fill="#D29C78"/>
  <!-- ears -->
  <ellipse cx="118" cy="238" rx="14" ry="22" fill="#C68E6A"/>
  <ellipse cx="282" cy="238" rx="14" ry="22" fill="#C68E6A"/>
  <circle cx="118" cy="258" r="4" fill="#DCF37B"/>
  <circle cx="282" cy="258" r="4" fill="#DCF37B"/>
  <!-- hair, front curls -->
  <g fill="#2B1D16">
    <circle cx="140" cy="134" r="34"/>
    <circle cx="182" cy="118" r="34"/>
    <circle cx="224" cy="118" r="34"/>
    <circle cx="264" cy="136" r="32"/>
    <circle cx="122" cy="168" r="24"/>
    <circle cx="280" cy="170" r="22"/>
  </g>
  <!-- brows -->
  <path d="M150 204q18-10 36 0" stroke="#2B1D16" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M214 204q18-10 36 0" stroke="#2B1D16" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="168" cy="230" rx="9" ry="11" fill="#2B1D16"/>
  <ellipse cx="232" cy="230" rx="9" ry="11" fill="#2B1D16"/>
  <circle cx="171" cy="226" r="3" fill="#FFFFFF"/>
  <circle cx="235" cy="226" r="3" fill="#FFFFFF"/>
  <!-- cheeks -->
  <circle cx="148" cy="270" r="15" fill="#E08A7A" opacity="0.45"/>
  <circle cx="252" cy="270" r="15" fill="#E08A7A" opacity="0.45"/>
  <!-- nose -->
  <path d="M200 236q-10 26 0 34" stroke="#A86F4F" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M164 290q36 34 72 0z" fill="#8E3B3B"/>
  <path d="M172 292q28 12 56 0" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
