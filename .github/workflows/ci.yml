name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Unit, fuzz and both payment rails
        working-directory: contracts
        run: forge test -vv
      - name: HSK mainnet fork suite (read-only; depends on the public RPC)
        working-directory: contracts
        continue-on-error: true
        env:
          HSK_RPC_URL: https://mainnet.hsk.xyz
        run: forge test --match-path "test/fork/*" -vv

  agents:
    name: Agents, HSP client and app (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agents/pnpm-lock.yaml
      - name: Build the contracts (the agents' end-to-end tests deploy them on anvil)
        working-directory: contracts
        run: forge build
      - name: Install
        working-directory: agents
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: agents
        run: pnpm run typecheck
      - name: Tests (HSP client, agents, end to end on anvil, app)
        working-directory: agents
        run: pnpm test
